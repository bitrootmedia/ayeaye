[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supertokens-python>=0.24",
    "pydantic-settings>=2.4",
    # EmailStr on the invite schemas.
    "email-validator>=2.2",
    # Pinned <6: taskiq-redis 1.2.x's blocking listen loop crashes on
    # redis-py >=6 ("Timeout reading from redis" / CancelledError).
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "taskiq[reload]>=0.11",
    "taskiq-redis>=1.0",
    # Async SMTP, so nothing ever blocks on a slow mail server.
    "aiosmtplib>=3.0",
    # S3 client for RustFS: presigned upload and download URLs. Synchronous,
    # so anything that actually talks to storage goes through a thread.
    "boto3>=1.35",
    # Thumbnails, in the worker. A gallery that downloads 12MP originals to
    # render them at 80px is the alternative.
    "pillow>=11.0",
]

[dependency-groups]
# Not installed in the prod image (Dockerfile.prod syncs with --no-dev).
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Tests import `app.*`; the package lives under src/ (same as --app-dir src).
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
# Alembic writes these from a template; don't fight it over import order.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
