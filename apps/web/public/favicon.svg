<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ayeayecaptain">
  <!--
    The wordmark's own tile: the same rounded square and the same Lucide
    anchor that `Landing.tsx`'s `Wordmark` draws, so the browser tab and the
    top-left corner of the app are recognisably one thing.

    The indigo is `--primary` resolved to sRGB (oklch(0.472 0.139 268)), not
    a `var()`: a favicon is rendered outside the page and has no access to
    the document's custom properties. It is the one place in this product
    where a colour is restated, and it is restated rather than approximated
    so a token change is a visible mismatch rather than a slow drift.

    A filled tile on both themes rather than a `prefers-color-scheme` swap —
    the tile *is* the background, so it needs no help from the one behind it.
  -->
  <rect width="32" height="32" rx="7" fill="#3a54a8" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 6v16" />
    <path d="m19 13 2-1a9 9 0 0 1-18 0l2 1" />
    <path d="M9 11h6" />
    <circle cx="12" cy="4" r="2" />
  </g>
</svg>
