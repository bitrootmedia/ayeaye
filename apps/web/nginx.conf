server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /auth/reset-password is a React route, not a file,
    # so anything that isn't on disk has to come back as index.html. Without
    # this, following a password-reset link from an email 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
