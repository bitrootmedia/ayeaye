# The stack. ONE file, and it is the production one.
#
#   docker compose up -d
#
# is correct on a server and correct on a laptop. There is no flag to remember
# and no second file to pass, because Compose auto-loads compose.override.yml
# when it is present — and it is present in a git checkout, absent in nothing.
# A self-hoster who clones this repo gets the dev override too, which is fine:
# they also get a .env pointing at localhost, and both are edited together.
#
# This matters more than it looks. In the project this one is descended from,
# dev and prod were two files and a deploy that forgot `-f compose.prod.yml`
# silently brought up the dev stack on the server: no reverse proxy, the site
# dark, and every container reporting healthy. For software strangers install
# on their own machines, that failure mode is not acceptable.
#
# Required values use ${VAR:?...} so a missing .env aborts with an explanation
# instead of starting eight healthy containers around a broken one.
#
# **Postgres and object storage are optional**, via COMPOSE_PROFILES. Every
# other service reaches them through DATABASE_URL / SUPERTOKENS_DATABASE_URL /
# S3_* — plain connection details, never a hardcoded `postgres` or `rustfs`
# hostname — so pointing at a managed instance is a `.env` change, not a fork
# of this file. `scripts/setup.sh` writes the local-container shape by
# default; `scripts/setup-interactive.sh` walks through bringing your own.
# `required: false` on the depends_on entries below is what lets `api` (always
# on) name `postgres` (sometimes absent) as a dependency without Compose
# refusing to start at all when the profile that would create it is off.

name: ayeayecaptain

services:
  # The only service that publishes a port. Everything else talks over the
  # internal network, so there is nothing else on the box to firewall.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_URL: ${SITE_URL:?missing .env — run ./scripts/setup.sh first}
      ACME_EMAIL: ${ACME_EMAIL:?missing .env — run ./scripts/setup.sh first}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # issued certificates — don't lose this volume
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      # Absent entirely when object storage is managed elsewhere — see the
      # `rustfs` service below.
      rustfs:
        condition: service_started
        required: false

  # Runs to completion before the API starts, every time. Without it the first
  # `up` points an API at an empty database, because nothing else creates the
  # schema — and a self-hoster must never be asked to run alembic by hand.
  #
  # A one-shot service rather than an entrypoint hook: it shows up in
  # `docker compose ps`, its logs are its own, and a failed migration stops the
  # rollout instead of leaving an API to retry against a half-migrated schema.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: "no"
    command: uv run alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing .env — run ./scripts/setup.sh first}
    depends_on:
      # Absent entirely when DATABASE_URL points at a managed instance — see
      # the `postgres` service below. Compose can't wait on a container that
      # was never asked to exist, and a managed database's uptime isn't this
      # stack's problem to gate startup on.
      postgres:
        condition: service_healthy
        required: false

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing .env — run ./scripts/setup.sh first}
      REDIS_URL: redis://redis:6379/0
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:?missing .env — run ./scripts/setup.sh first}
      # One origin for the SPA, the API and the auth routes. See the Caddyfile.
      SITE_URL: ${SITE_URL:?missing .env — run ./scripts/setup.sh first}
      # Internal for our own calls; presigned URLs are signed against the
      # public one, because SigV4 covers the Host header. Both point at the
      # bundled RustFS by default; a managed S3-compatible provider replaces
      # them with its own endpoint and a public one that is NOT the site
      # origin — which means its bucket needs a CORS rule allowing SITE_URL,
      # something the bundled setup never has to think about.
      S3_ENDPOINT: ${S3_ENDPOINT:?missing .env — run ./scripts/setup.sh first}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?missing .env — run ./scripts/setup.sh first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?missing .env — run ./scripts/setup.sh first}
      # Leave SMTP_HOST empty to disable email entirely — a supported
      # configuration, not a broken one. See PLAN.md §2.4.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      supertokens:
        condition: service_healthy

  # The same image as `api` with a different command, so models, config and
  # database code can never drift between the two. Anything that talks to an
  # SMTP server belongs here rather than on a request thread.
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: uv run taskiq worker app.tasks:broker
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing .env — run ./scripts/setup.sh first}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      SITE_URL: ${SITE_URL:?missing .env — run ./scripts/setup.sh first}
      # The worker reaches storage too — it makes the thumbnails. Same image as
      # `api`, but a separate environment block, so anything the API needs and
      # the worker also uses has to be repeated here.
      S3_ENDPOINT: ${S3_ENDPOINT:?missing .env — run ./scripts/setup.sh first}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?missing .env — run ./scripts/setup.sh first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?missing .env — run ./scripts/setup.sh first}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  # The clock. Enqueues periodic jobs onto the same Redis queue the worker
  # drains — it never does the work itself, so a slow sweep can't delay the
  # next tick. Currently one job: the hourly reminder sweep.
  #
  # A tenth container earns its place because a reminder has to arrive whether
  # or not anyone has the app open, and a loop inside the API would die on
  # every reload and would fire twice the day someone runs two replicas.
  # Everything it triggers is idempotent regardless — see the `notified_*_at`
  # claim in services/reminders.py — so a restart mid-sweep costs nothing.
  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: uv run taskiq scheduler app.tasks:scheduler
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing .env — run ./scripts/setup.sh first}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      SITE_URL: ${SITE_URL:?missing .env — run ./scripts/setup.sh first}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  # Object storage for comment attachments. Not published to the host — Caddy
  # proxies /media/* to it, which is also what makes uploads same-origin and
  # therefore free of CORS entirely.
  #
  # Only started when `local-storage` is in COMPOSE_PROFILES (the default —
  # see .env.example). Leave it out and `api`/`worker` talk to whatever
  # S3_ENDPOINT names instead; this service and its volume simply never exist.
  # Its own credentials are deliberately a SEPARATE pair from S3_ACCESS_KEY /
  # S3_SECRET_KEY: those describe whatever storage the app is CONFIGURED to
  # use, which in the managed case is a provider this container has nothing to
  # do with.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    profiles: ["local-storage"]
    environment:
      # Soft-defaulted, not required: this only matters when `local-storage`
      # is active, and both setup scripts always fill in a real secret then.
      # A hard requirement here would fail interpolation for a deployment
      # that never starts this service at all — Compose checks `:?` for every
      # service in the file, active profile or not.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # No console in production; the S3 API is all the app needs.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs_data:/data

  # --- data ------------------------------------------------------------------

  # Only started when `local-db` is in COMPOSE_PROFILES (the default — see
  # .env.example). Leave it out and every other service reaches Postgres
  # through DATABASE_URL / SUPERTOKENS_DATABASE_URL instead; this container and
  # its volume simply never exist. Its own credentials are POSTGRES_USER /
  # POSTGRES_PASSWORD / POSTGRES_DB, used ONLY to initialise this container —
  # a managed instance has its own, already-created, and doesn't need these.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Soft-defaulted, not required: this only matters when `local-db` is
      # active, and both setup scripts always fill in a real password then.
      # A hard requirement here would fail interpolation for a deployment
      # that never starts this service at all — Compose checks `:?` for every
      # service in the file, active profile or not. DATABASE_URL below is
      # what everything else actually connects with, and that stays required.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unused}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      # PG18+ images keep data in a version subdirectory, so the volume mounts
      # at /var/lib/postgresql — NOT .../data as it did up to 17.
      - postgres_data:/var/lib/postgresql
      # Creates the separate `supertokens` database on first boot. Only runs
      # against THIS container's own empty data directory — a managed instance
      # needs `CREATE DATABASE supertokens;` run against it once, by hand.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist the queue so a restart doesn't drop pending work.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      POSTGRESQL_CONNECTION_URI: ${SUPERTOKENS_DATABASE_URL:?missing .env — run ./scripts/setup.sh first}
      API_KEYS: ${SUPERTOKENS_API_KEY:?missing .env — run ./scripts/setup.sh first}
    healthcheck:
      # The image doesn't reliably ship curl or wget, so this speaks raw HTTP
      # over bash's /dev/tcp. A wget-based check reports unhealthy forever
      # regardless of whether the core is fine.
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 &&
        echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 &&
        cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  rustfs_data:
  redis_data:
  caddy_data:
  caddy_config:
